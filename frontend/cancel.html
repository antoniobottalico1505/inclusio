<!doctype html>
<html lang="it">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/logo-square.svg" />
  <meta name="theme-color" content="#15364D" />
  <meta property="og:image" content="/logo-square.svg" />
  <title>Inclusio — Pagamento interrotto</title>
  <meta name="description" content="Pagamento interrotto senza errori." />
</head>
  <body data-page="cancel">
    <header class="site-header">
      <div class="shell nav-row">
        <a class="brand" href="/">
          <img class="brand-logo" src="/logo-square.svg" alt="Logo Inclusio" />
          <span>Inclusio</span>
        </a>
        <nav class="nav-links">
          <a href="/">Home</a>
          <a href="/pricing">Prezzi</a>
          <a href="/schools">Scuole</a>
          <a href="/waitlist">Lista d'attesa</a>
          <a class="button button-primary button-sm" href="/app">Apri demo</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="shell success-box">
        <div class="eyebrow">Pagamento interrotto</div>
        <h1>Nessun problema</h1>
        <p>Il checkout è stato interrotto. L’utente può tornare ai piani o entrare in lista d’attesa.</p>
        <div class="button-row">
          <a class="button button-primary" href="/pricing">Torna ai prezzi</a>
          <a class="button button-secondary" href="/waitlist">Entra in lista d’attesa</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell footer-row">
        <div class="brand brand-footer">
          <img class="brand-logo" src="/logo-square.svg" alt="Logo Inclusio" />
          <span>Inclusio</span>
        </div>
        <div class="nav-links">
          <a href="/pricing">Prezzi</a>
          <a href="/schools">Scuole</a>
          <a href="/waitlist">Lista d'attesa</a>
          <a href="/app">Demo</a>
        </div>
      </div>
    </footer>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
